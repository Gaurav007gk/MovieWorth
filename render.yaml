databases:
  - name: movieworth-db
    databaseName: movieworth
    user: movieworth
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: movieworth-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: movieworth-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: movieworth-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: movieworth-db
          property: password
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://gaurav007gk.github.io
      - key: BOX_OFFICE_SOURCE_ENABLED
        value: "false"
      - key: BOX_OFFICE_FEED_URL
        sync: false
      - key: BOX_OFFICE_FEED_TOKEN
        sync: false
