server:
  port: ${PORT:8080}
spring:
  application:
    name: movieworth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movieworth}
    username: ${DB_USERNAME:movieworth}
    password: ${DB_PASSWORD:movieworth_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info
movieworth:
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gaurav007gk.github.io,http://localhost:5500,http://127.0.0.1:5500}
  box-office:
    enabled: ${BOX_OFFICE_SOURCE_ENABLED:false}
    feed-url: ${BOX_OFFICE_FEED_URL:}
    feed-token: ${BOX_OFFICE_FEED_TOKEN:}
    cron: ${BOX_OFFICE_CRON:0 0 * * * *}
