services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movieworth
      POSTGRES_USER: movieworth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movieworth_local}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieworth -d movieworth"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/movieworth
      DB_USERNAME: movieworth
      DB_PASSWORD: ${POSTGRES_PASSWORD:-movieworth_local}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://gaurav007gk.github.io}
      BOX_OFFICE_SOURCE_ENABLED: ${BOX_OFFICE_SOURCE_ENABLED:-false}
      BOX_OFFICE_FEED_URL: ${BOX_OFFICE_FEED_URL:-}
      BOX_OFFICE_FEED_TOKEN: ${BOX_OFFICE_FEED_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
volumes: {pgdata: {}}
